[project]
name = "jarvis-plugin-example"
version = "0.1.0"
description = "Example Jarvis plugin: account balances from a JSON API. Copy it to start your own."
requires-python = ">=3.11"
# Jarvis provides httpx2 and its plugin API at runtime; list only your own extra dependencies.
dependencies = []

[project.entry-points."jarvis_hud.plugins"]
example_wallet = "jarvis_plugin_example:WalletPlugin"

[dependency-groups]
dev = ["jarvis-hud", "pytest"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_plugin_example"]

[tool.uv.sources]
jarvis-hud = { path = "../..", editable = true }
