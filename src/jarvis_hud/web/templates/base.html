<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07090c">
  <title>{% block title %}Jarvis{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <script src="{{ url_for('static', path='htmx.min.js') }}" defer></script>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}
  <div class="page">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Jarvis dashboard">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name" aria-hidden="true">J.A.R.V.I.S.</span>
      </a>
      {% if request.state.authenticated %}
      {% set path = request.url.path %}
      <nav class="nav" aria-label="Main">
        <a href="/" {% if path == "/" %}aria-current="page"{% endif %}>Home</a>
        <a href="/tasks" {% if path.startswith("/tasks") %}aria-current="page"{% endif %}>To-do</a>
        <a href="/integrations" {% if path.startswith("/integrations") %}aria-current="page"{% endif %}>Integrations</a>
        <a href="/settings/security" {% if path.startswith("/settings") %}aria-current="page"{% endif %}>Security</a>
      </nav>
      <form class="nav topbar-end" method="post" action="/logout">
        <button type="submit">Sign out</button>
      </form>
      {% endif %}
    </header>
    <main class="{% block main_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>
    <footer class="footer label">
      <span>Jarvis {{ version }} · self-hosted</span>
    </footer>
  </div>
  {% endblock %}
</body>
</html>
