{% extends "base.html" %}

{% block title %}Sign in · Jarvis{% endblock %}

{% block head %}
<script src="{{ url_for('static', path='passkeys.js') }}" defer></script>
{% endblock %}

{% block content %}
<section class="panel narrow">
  <h2>Sign in</h2>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  {% if has_passkeys %}
  <button type="button" data-passkey-login data-next="{{ next }}">Sign in with a passkey</button>
  <p class="error" role="alert" data-passkey-error hidden></p>
  <p class="divider">or</p>
  {% endif %}
  <form method="post" action="/login" class="form">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required {% if not has_passkeys %}autofocus{% endif %}>
    </label>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
