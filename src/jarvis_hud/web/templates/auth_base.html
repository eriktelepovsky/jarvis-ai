{% extends "base.html" %}

{% block body %}
<div class="auth-page">
  <main class="auth">
    <div class="orb" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <div class="auth-title">
      <div class="brand-name">J.A.R.V.I.S.</div>
      <div class="label">Personal briefing · single-user install</div>
    </div>
    <section class="auth-card hud-corners">
      <span class="hud-corner-b" aria-hidden="true"></span>
      {% block card %}{% endblock %}
    </section>
    <div class="auth-footer label">
      <span><span style="color: var(--live)">●</span> {{ request.url.hostname }}</span>
      <span>Jarvis {{ version }}</span>
    </div>
  </main>
</div>
{% endblock %}
