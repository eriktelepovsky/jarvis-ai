<ol class="steps-inline">
  <li>In GitLab, open <strong>Preferences → Access tokens</strong> (on gitlab.com: <a href="https://gitlab.com/-/user_settings/personal_access_tokens?name=Jarvis&amp;scopes=read_api" target="_blank" rel="noopener">Personal access tokens</a>).</li>
  <li>Add a token named <code>Jarvis</code> with the <code>read_api</code> scope.</li>
  <li>Paste the GitLab address and the token below. Jarvis only reads.</li>
</ol>
