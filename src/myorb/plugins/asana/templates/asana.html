<ol class="steps-inline">
  <li>Open <a href="https://app.asana.com/0/my-apps" target="_blank" rel="noopener">Asana → My apps</a>, click <strong>Create new token</strong> under Personal access tokens, name it <code>myOrb</code> and copy it.</li>
