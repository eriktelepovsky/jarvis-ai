{# Stroke icons from the myOrb design. Decorative: the text next to them carries the meaning. #}
{% macro icon(name, size=15) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == "brief" %}<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>
{%- elif name == "calendar" %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
{%- elif name == "mail" %}<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
{%- elif name == "check" %}<path d="m5 12 5 5 9-10"/>
{%- elif name == "plug" %}<path d="M9 7V3M15 7V3M7 7h10v4a5 5 0 0 1-10 0V7ZM12 16v5"/>
{%- elif name == "key" %}<circle cx="8" cy="8" r="4"/><path d="M2 21a6 6 0 0 1 12 0M16 11a3 3 0 1 1 3 3v6l-1.5 1.5L16 20v-1l1-1-1-1"/>
{%- else %}<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
{%- endif %}
</svg>
{%- endmacro %}
