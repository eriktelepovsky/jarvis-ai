{% extends "auth_base.html" %}
{% from "icons.html" import icon %}

{% block title %}Sign in · {{ assistant }}{% endblock %}

{% block card %}
<h1>Welcome back</h1>
{% if has_passkeys %}
<button type="button" class="btn btn-primary btn-large" data-passkey-login data-next="{{ next }}">
  {{ icon("key", 18) }} Sign in with passkey
</button>
<div class="alert alert-error" role="alert" data-passkey-error hidden></div>
{% else %}
<form method="post" action="/login" hx-boost="false" class="form">
  <input type="hidden" name="next" value="{{ next }}">
  <div class="field">
    <label class="label" for="password">Password</label>
    <input class="input" id="password" type="password" name="password" autocomplete="current-password" required {% if error %}aria-invalid="true" aria-describedby="login-error"{% endif %} autofocus>
  </div>
  <button type="submit" class="btn btn-primary btn-large">Sign in</button>
</form>
{% endif %}
{% if error %}
<div class="alert alert-error" role="alert" id="login-error"><span class="alert-tag">✕ ERROR</span><span>{{ error }}</span></div>
{% endif %}
{% endblock %}
