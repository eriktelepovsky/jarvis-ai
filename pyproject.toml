[project]
name = "jarvis-hud"
version = "0.0.1"
description = "Personal AI-powered daily briefing dashboard that summarizes your email, calendar, tasks, finances and more."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Erik Telepovský", email = "erik.telepovsky@gmail.com" }]
requires-python = ">=3.11"
keywords = ["assistant", "dashboard", "ai", "productivity", "briefing", "jarvis"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "anthropic>=2.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.156.8",
    "granian[reload,uvloop]>=2.8.5",
    "httpx2>=2.16.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.5",
    "tzdata>=2026.5",
    "webauthn>=3.0.1",
]

[project.urls]
Homepage = "https://github.com/eriktelepovsky/jarvis-hud"
Repository = "https://github.com/eriktelepovsky/jarvis-hud"
Issues = "https://github.com/eriktelepovsky/jarvis-hud/issues"

[project.scripts]
jarvis = "jarvis_hud.cli:main"

[project.entry-points."jarvis_hud.plugins"]
calendar = "jarvis_hud.plugins.calendar:CalendarPlugin"
gmail = "jarvis_hud.plugins.gmail:GmailPlugin"
tasks = "jarvis_hud.tasks.plugin:TasksPlugin"
code_review = "jarvis_hud.plugins.code_review:CodeReviewPlugin"
jira = "jarvis_hud.plugins.jira:JiraPlugin"
weather = "jarvis_hud.plugins.weather:WeatherPlugin"
youtube = "jarvis_hud.plugins.youtube:YouTubePlugin"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_hud"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
