[project]
name = "myorb"
version = "0.25.1"
description = "Personal AI-powered daily briefing dashboard that summarizes your email, calendar, tasks, finances and more."
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Erik Telepovský", email = "erik.telepovsky@gmail.com" }]
requires-python = ">=3.11"
keywords = ["assistant", "dashboard", "ai", "productivity", "briefing", "myorb"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "anthropic>=2.1.0",
    "cryptography>=50.0.2",
    "fastapi>=0.156.8",
    "granian[reload,uvloop]>=2.8.5",
    "httpx2>=2.16.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "sqlalchemy[asyncio]>=2.1.5",
    "tzdata>=2026.5",
    "webauthn>=3.0.1",
]

[project.urls]
Homepage = "https://github.com/eriktelepovsky/myorb"
Repository = "https://github.com/eriktelepovsky/myorb"
Issues = "https://github.com/eriktelepovsky/myorb/issues"

[project.scripts]
myorb = "myorb.cli:main"

[project.entry-points."myorb.plugins"]
calendar = "myorb.plugins.calendar:CalendarPlugin"
gmail = "myorb.plugins.gmail:GmailPlugin"
tasks = "myorb.tasks.plugin:TasksPlugin"
brief = "myorb.brief.plugin:BriefPlugin"
code_review = "myorb.plugins.code_review:CodeReviewPlugin"
jira = "myorb.plugins.jira:JiraPlugin"
asana = "myorb.plugins.asana:AsanaPlugin"
custom = "myorb.plugins.custom:CustomPlugin"
weather = "myorb.plugins.weather:WeatherPlugin"
youtube = "myorb.plugins.youtube:YouTubePlugin"
slack = "myorb.plugins.slack:SlackPlugin"
health = "myorb.plugins.health:HealthPlugin"
uptime = "myorb.plugins.uptime:UptimePlugin"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myorb"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
