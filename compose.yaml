# Run Jarvis with: docker compose up -d
# Then find the setup link with: docker logs jarvis
services:
  jarvis:
    image: ghcr.io/eriktelepovsky/jarvis-hud:latest
    container_name: jarvis
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - jarvis-data:/data
    environment:
      # Your time zone (e.g. Europe/Bratislava), used for "today" and event times
      JARVIS_TIMEZONE: ${JARVIS_TIMEZONE:-UTC}
      # Public address when Jarvis runs behind a reverse proxy, e.g. https://jarvis.example.com
      JARVIS_PUBLIC_URL: ${JARVIS_PUBLIC_URL:-}
      # IP addresses or networks of the reverse proxy whose X-Forwarded-* headers are trusted
      JARVIS_TRUSTED_PROXIES: ${JARVIS_TRUSTED_PROXIES:-127.0.0.1}
      # Key that encrypts stored credentials; when empty, one is generated in the data volume
      JARVIS_SECRET_KEY: ${JARVIS_SECRET_KEY:-}
      # Custom plugins to install at startup, e.g. "jarvis-wallet==1.2" or a local path
      JARVIS_PLUGINS: ${JARVIS_PLUGINS:-}

volumes:
  jarvis-data:
